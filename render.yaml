# Render Infrastructure as Code (Blueprint)
# Deploy easily by connecting your repo to https://dashboard.render.com/blueprints

services:
  # Option 1: Unified Next.js + Express Full-Stack Service (Recommended for single-service deployment)
  - type: web
    name: job-portal-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api
      # If connecting to Render Managed PostgreSQL, uncomment DATABASE_URL below:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: job-portal-db
      #     property: connectionString

# Uncomment below to provision a free Managed PostgreSQL database on Render:
# databases:
#   - name: job-portal-db
#     databaseName: job_portal
#     user: job_user
#     plan: free
#     region: oregon
